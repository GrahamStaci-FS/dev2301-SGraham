<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Florida Man headlines with weather information from the day each story was published."
    />
    <title>Florida Man Weather</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <div class="container">
        <h1>Florida Man Weather</h1>
        <p>What was the weather like when it happened?</p>
      </div>
    </header>

    <main>
      <section class="controls">
        <div class="container">
          <button id="new-stories" type="button">New Stories</button>
        </div>
      </section>

      <section class="headlines">
        <div class="container">
          <div id="headline-grid" class="headline-grid"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>
          Florida Man Weather uses data from the Florida Man API and Visual
          Crossing Weather.
        </p>
      </div>
    </footer>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/API.js"></script>
  </body>
</html>
